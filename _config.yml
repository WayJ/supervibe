# main /(root): publish only the four reviewed static files.
# Keep Jekyll enabled: .nojekyll would bypass these exclusions.
theme: null
plugins: []
exclude:
  - .agents
  - .claude-plugin
  - .git
  - .github
  - .gitignore
  - AGENTS.md
  - CHANGELOG.md
  - LICENSE
  - README.md
  - README.zh-CN.md
  - _config.yml
  - docs
  - scripts
  - site
  - skills
  - templates
  - tests
  - web
